upstream api_backend {
    least_conn;
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream storefront_backend {
    least_conn;
    server storefront:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream admin_backend {
    server admin:3001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
