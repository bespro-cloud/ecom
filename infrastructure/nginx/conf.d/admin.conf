# The admin console.
#
# Publishing it on the public internet at all is a deliberate decision. Prefer
# restricting it to an office range or a VPN with the `allow`/`deny` block
# below; the application still enforces roles, permissions and MFA either way.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${ADMIN_HOST};

    ssl_certificate     /etc/nginx/certs/admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/admin/chain.pem;

    include /etc/nginx/conf.d/security-headers.conf;
    # Internal tooling should never be indexed, whatever the app says.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    limit_conn perip 20;

    # Uncomment and set to your office/VPN ranges to take the console off the
    # public internet entirely.
    # allow 203.0.113.0/24;
    # deny all;

    location /_next/static/ {
        proxy_pass http://admin_backend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~ ^/api/proxy/api/v1/(auth|users/invite/accept) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://admin_backend;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://admin_backend;
    }
}
