server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${STOREFRONT_HOST};

    ssl_certificate     /etc/nginx/certs/storefront/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/storefront/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/storefront/chain.pem;

    include /etc/nginx/conf.d/security-headers.conf;

    limit_conn perip 40;

    # Next.js build output is content-hashed, so it can be cached indefinitely.
    location /_next/static/ {
        proxy_pass http://storefront_backend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /_next/image {
        proxy_pass http://storefront_backend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Sign-in and registration: strict limit, with a burst so a genuine user
    # correcting a typo is not caught by it.
    location ~ ^/api/proxy/api/v1/auth/(login|register|mfa|password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://storefront_backend;
    }

    location /api/proxy/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://storefront_backend;
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://storefront_backend;
    }

    # Health checks bypass the rate limiter and are not logged.
    location = /health {
        access_log off;
        proxy_pass http://storefront_backend/;
    }
}
