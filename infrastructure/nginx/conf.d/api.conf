# Direct API host.
#
# The web apps proxy through their own origin, so this exists for machine
# clients: webhooks from payment and fulfilment providers, and integrations.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${API_HOST};

    ssl_certificate     /etc/nginx/certs/api/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/api/chain.pem;

    include /etc/nginx/conf.d/security-headers.conf;

    limit_conn perip 30;

    # Probes: unlimited, unlogged, and never cached.
    location ~ ^/health {
        access_log off;
        proxy_pass http://api_backend;
    }

    # Metrics are for the internal scraper only.
    location = /health/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        proxy_pass http://api_backend;
    }

    location ~ ^/api/v1/auth/(login|register|mfa|password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api_backend;
    }

    # Provider webhooks. A larger burst than the auth paths because a provider
    # legitimately redelivers in bursts, and the handler is idempotent.
    location ~ ^/api/v1/webhooks/ {
        limit_req zone=api burst=100 nodelay;
        # Signature verification needs the exact bytes that were signed.
        proxy_request_buffering on;
        proxy_pass http://api_backend;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api_backend;
    }
}
