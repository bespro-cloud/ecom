name: CI

# Runs on every pull request and every push to main. The job order mirrors how
# quickly a failure is worth knowing about: lint and typecheck are cheap and
# fail fast; integration and e2e follow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.13'
  PNPM_VERSION: '10.33.0'
  # Deterministic, obviously-fake key material for CI. Real values come from
  # the secret manager and never appear in a workflow file.
  CI_SESSION_SECRET: Y2ktb25seS1zZXNzaW9uLXNlY3JldC1uZXZlci11c2VkLWluLXByb2Q=
  CI_ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS1uZXZlci11c2VkLWluLXByb2Q=

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  static:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # `prisma migrate diff` rebuilds the migration history into a scratch
      # database to compare it against the schema.
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: healthcommerce
          POSTGRES_PASSWORD: healthcommerce
          POSTGRES_DB: health_commerce_shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U healthcommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @health/database run generate

      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify the Prisma schema and migrations agree
        run: |
          pnpm exec prisma validate --schema prisma/schema.prisma
          node scripts/check-schema-drift.mjs
        env:
          SHADOW_DATABASE_URL: postgresql://healthcommerce:healthcommerce@localhost:5432/health_commerce_shadow

  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @health/database run generate
      - run: pnpm --filter "./packages/*" run build
      - name: Run unit tests
        run: pnpm run test:unit

  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: healthcommerce
          POSTGRES_PASSWORD: healthcommerce
          POSTGRES_DB: health_commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U healthcommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://healthcommerce:healthcommerce@localhost:5432/health_commerce_test?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: hcci
      API_PUBLIC_URL: http://localhost:4000
      STOREFRONT_PUBLIC_URL: http://localhost:3000
      ADMIN_PUBLIC_URL: http://localhost:3001
      COOKIE_SECURE: 'false'
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: fatal
      RATE_LIMIT_GLOBAL_PER_MINUTE: '10000'
      RATE_LIMIT_AUTH_PER_MINUTE: '1000'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @health/database run generate
      - run: pnpm --filter "./packages/*" run build

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          SESSION_SECRET: ${{ env.CI_SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ env.CI_ENCRYPTION_KEY }}

  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @health/database run generate

      - name: Build everything
        run: pnpm run build
        env:
          API_INTERNAL_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3001

      - name: Verify the production environment contract is enforced
        # The API must refuse to start in production with a mock payment
        # provider or a wildcard CORS policy. If this ever passes, a guard rail
        # has been removed.
        run: node scripts/verify-production-guards.mjs

  # ---------------------------------------------------------------------------
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # High and critical advisories fail the build; lower severities are
        # reported and triaged rather than blocking every PR.
        run: pnpm audit --audit-level high

      - name: Check for committed secrets
        run: node scripts/check-secrets.mjs
