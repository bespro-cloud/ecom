# Production overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the development stack that matter:
#   * No port is published from the database, cache or object storage. Nothing
#     but nginx is reachable from outside the host.
#   * Images are pulled by immutable tag, not rebuilt on the host.
#   * Every service is resource-capped, read-only where it can be, and has
#     privilege escalation disabled.
#   * Secrets come from the environment/secret manager — never from this file.

name: health-commerce

x-hardening: &hardening
  restart: always
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  postgres:
    <<: *hardening
    image: postgres:16.6-alpine
    read_only: false # initdb and WAL need to write outside the volume
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='/bin/true'
      -c log_min_duration_statement=500
      -c log_connections=on
      -c log_disconnections=on
    deploy:
      resources:
        limits: { cpus: '2', memory: 4G }

  redis:
    <<: *hardening
    read_only: false
    ports: !override []
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: '1', memory: 1200M }

  minio:
    <<: *hardening
    read_only: false
    ports: !override []

  api:
    <<: *hardening
    image: ${REGISTRY:?set REGISTRY}/health-commerce-api:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    ports: !override []
    environment:
      NODE_ENV: production
    deploy:
      # Two replicas so a rolling restart never drops to zero capacity.
      replicas: 2
      resources:
        limits: { cpus: '1', memory: 1G }
        reservations: { memory: 512M }

  worker:
    <<: *hardening
    image: ${REGISTRY:?set REGISTRY}/health-commerce-worker:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    ports: !override []
    environment:
      NODE_ENV: production
    deploy:
      # One worker instance. The outbox uses SELECT ... FOR UPDATE SKIP LOCKED,
      # so scaling out is safe when throughput demands it.
      replicas: 1
      resources:
        limits: { cpus: '1', memory: 1G }

  storefront:
    <<: *hardening
    image: ${REGISTRY:?set REGISTRY}/health-commerce-storefront:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    ports: !override []
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '1', memory: 768M }

  admin:
    <<: *hardening
    image: ${REGISTRY:?set REGISTRY}/health-commerce-admin:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    ports: !override []
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '0.5', memory: 512M }

  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=8m
    depends_on: [api, storefront, admin]
    deploy:
      resources:
        limits: { cpus: '1', memory: 256M }

volumes:
  nginx-cache:
