# Local development stack.
#
# PostgreSQL and Redis are bound to 127.0.0.1 only — they are reachable from
# your machine for psql/redis-cli, never from the network. Nothing here is
# hardened for production; see docker-compose.prod.yml.

name: health-commerce

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthcommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcommerce}
      POSTGRES_DB: ${POSTGRES_DB:-health_commerce}
      # Deterministic collation, so ORDER BY does not differ between machines.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-healthcommerce} -d ${POSTGRES_DB:-health_commerce}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Persistence on: BullMQ jobs in flight should survive a restart.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for product images, documents and evidence
  # files. Used from Phase 2; running it locally now keeps the contract honest.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      # At the repository root so hosted platforms that default to ./Dockerfile
      # find it. The worker and web images keep an explicit path.
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthcommerce}:${POSTGRES_PASSWORD:-healthcommerce}@postgres:5432/${POSTGRES_DB:-health_commerce}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthcommerce}:${POSTGRES_PASSWORD:-healthcommerce}@postgres:5432/${POSTGRES_DB:-health_commerce}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4100:4100'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  storefront:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP: storefront
        PORT: '3000'
        NEXT_PUBLIC_SITE_URL: ${STOREFRONT_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Health Commerce}
    restart: unless-stopped
    environment:
      # Server-to-server inside the compose network; never a browser URL.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${STOREFRONT_PUBLIC_URL:-http://localhost:3000}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on: [api]

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP: admin
        PORT: '3001'
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3001}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
  minio-data:
